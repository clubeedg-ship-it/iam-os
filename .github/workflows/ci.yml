name: CI

on:
  push:
    branches: [main]
  pull_request:

# Git LFS objects are intentionally NOT downloaded in CI. The only LFS-tracked
# file is a legacy reference binary that no job uses; pulling it would consume
# the repository's LFS bandwidth quota on every run. Checkout fetches LFS
# pointer files only (the actions/checkout default).

jobs:
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - name: ruff check
        run: ruff check .

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          pip install \
            numpy \
            pytest \
            pytest-asyncio \
            pytest-aiohttp \
            jsonschema \
            websockets \
            aiohttp
      - name: Run lidar-service tests
        run: pytest services/lidar-service/tests
      - name: Run touch-bridge tests
        run: pytest services/touch-bridge/tests
      - name: Run web-server tests
        run: pytest services/web-server/tests

  lint-js:
    name: Lint (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci
      - name: ESLint
        working-directory: launcher
        run: npm run lint

  validate-games:
    name: Validate games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Placeholder - game validation is implemented in Phase 5."

  build-launcher:
    name: Build launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci
      - name: Vite build
        working-directory: launcher
        run: npm run build
      - name: Upload launcher dist
        uses: actions/upload-artifact@v4
        with:
          name: launcher-dist
          path: launcher/dist
          if-no-files-found: error
