name: CI

on:
  push:
    branches: [main]
  pull_request:

# Git LFS objects are intentionally NOT downloaded in CI. The only LFS-tracked
# file is a legacy reference binary that no job uses; pulling it would consume
# the repository's LFS bandwidth quota on every run. Checkout fetches LFS
# pointer files only (the actions/checkout default).

jobs:
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - name: ruff check
        run: ruff check .

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: pytest
        run: |
          if find . -path ./.git -prune -o -path ./legacy -prune -o -name 'test_*.py' -print | grep -q .; then
            pytest
          else
            echo "No Python tests yet; Phase 2 introduces the lidar-service test suite."
          fi

  lint-js:
    name: Lint (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: eslint
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint --if-present
          else
            echo "No JavaScript project yet; Phase 4 introduces the launcher."
          fi

  validate-games:
    name: Validate games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Placeholder - game validation is implemented in Phase 5."

  build-launcher:
    name: Build launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Placeholder - launcher build is implemented in Phase 4."
