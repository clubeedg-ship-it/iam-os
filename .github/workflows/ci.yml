name: CI

on:
  push:
    branches: [main]
  pull_request:

# Git LFS objects are intentionally NOT downloaded in CI. The only LFS-tracked
# file is a legacy reference binary that no job uses; pulling it would consume
# the repository's LFS bandwidth quota on every run. Checkout fetches LFS
# pointer files only (the actions/checkout default).

jobs:
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - name: ruff check
        run: ruff check .

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          pip install \
            numpy \
            pytest \
            pytest-asyncio \
            pytest-aiohttp \
            jsonschema \
            websockets \
            aiohttp
      - name: Run lidar-service tests
        run: pytest services/lidar-service/tests
      - name: Run touch-bridge tests
        run: pytest services/touch-bridge/tests
      - name: Run web-server tests
        run: pytest services/web-server/tests

  lint-js:
    name: Lint (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci
      - name: ESLint
        working-directory: launcher
        run: npm run lint

  validate-games:
    name: Validate games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator + Playwright dependencies
        run: pip install jsonschema pytest pytest-playwright
      - name: Static validation
        run: python scripts/validate_games.py
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Headless game smoke
        run: pytest scripts/tests/test_games_smoke.py
      - name: Validator unit tests
        run: pytest scripts/tests/test_validate_games.py

  lint-shell:
    name: Lint (shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
      - name: ShellCheck
        run: |
          mapfile -t files < <(
            find . -type f -name '*.sh' \
              -not -path './legacy/*' \
              -not -path './*/node_modules/*' \
              -not -path './*/dist/*' \
              -not -path './*/.venv/*' \
              -not -path './*/.git/*'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts found"
            exit 0
          fi
          printf 'checking %d file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          # --severity=warning skips info-level diagnostics; in practice
          # the noisy ones we hit (SC2317 unreachable after trap, SC2329
          # function indirectly invoked via trap) are both info and
          # legitimate idioms we use deliberately in cleanup handlers.
          shellcheck --severity=warning "${files[@]}"

  validate-units:
    name: Validate systemd units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: systemd-analyze verify
        run: |
          # systemd-analyze verify checks syntax + executable presence on
          # the host where it runs. The appliance-only ExecStart paths
          # (/opt/iam-os/..., /usr/bin/cage) do not exist on the GitHub
          # runner — but their absence here does not mean the units are
          # malformed. Strip those expected "is not executable" lines
          # and fail only if something else remains.
          status=0
          for unit in os-image/units/*.service; do
            echo "::group::$unit"
            raw="$(systemd-analyze verify --recursive-errors=no "$unit" 2>&1 || true)"
            printf '%s\n' "$raw"
            real="$(printf '%s\n' "$raw" | grep -Ev 'is not executable: No such file or directory' || true)"
            if [ -n "$real" ]; then
              printf '\n::error::unexpected diagnostic in %s\n' "$unit"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

  build-launcher:
    name: Build launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci
      - name: Vite build
        working-directory: launcher
        run: npm run build
      - name: Upload launcher dist
        uses: actions/upload-artifact@v4
        with:
          name: launcher-dist
          path: launcher/dist
          if-no-files-found: error

  build-image:
    name: Build appliance image
    runs-on: ubuntu-latest
    needs: build-launcher
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve image version (filesystem-safe)
        id: imgver
        run: |
          # github.ref_name on PRs is "<PR#>/merge" — the slash breaks
          # file paths. Sanitize to a plain identifier and append the
          # short SHA so the artifact is still traceable.
          ref="${GITHUB_REF_NAME//\//-}"
          short="$(git rev-parse --short HEAD)"
          v="${ref}-${short}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image version: $v"
      - name: Install image build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap \
            debian-archive-keyring \
            parted \
            dosfstools \
            e2fsprogs \
            gdisk \
            systemd-container
      - name: Download launcher dist
        uses: actions/download-artifact@v4
        with:
          name: launcher-dist
          path: launcher/dist
      - name: Build rootfs
        env:
          IAM_OS_VERSION: ${{ steps.imgver.outputs.version }}
        run: ./os-image/build.sh
      - name: Build appliance image
        env:
          IAM_OS_VERSION: ${{ steps.imgver.outputs.version }}
        run: ./os-image/make-image.sh
      - name: Image summary
        run: |
          ls -lh out/
          # Verify the image is non-empty and the partition table parses.
          IMG_GZ=$(ls out/iam-os-*.img.gz | head -1)
          [ -n "$IMG_GZ" ] || { echo "no .img.gz produced"; exit 1; }
          gzip -t "$IMG_GZ"
      - name: Upload appliance image
        uses: actions/upload-artifact@v4
        with:
          name: iam-os-image
          path: out/iam-os-*.img.gz
          if-no-files-found: error
          retention-days: 7
