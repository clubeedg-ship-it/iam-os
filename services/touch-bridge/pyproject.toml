[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iam-touch-bridge"
version = "0.1.0"
description = "IAM-OS touch bridge: lidar-service frames to the WebSocket touch contract."
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.0",
    "ruff>=0.6",
]

[project.scripts]
iam-touch-bridge = "iam_bridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["iam_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
