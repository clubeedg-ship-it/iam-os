[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iam-os-scripts"
version = "0.1.0"
description = "IAM-OS pipeline scripts: game validation, smoke tests."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["validate_games"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
